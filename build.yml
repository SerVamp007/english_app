name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: |
          flutter create --platforms=android --project-name wordten --org com.wordten _tmp
          cp -r _tmp/android android
          rm -rf _tmp
      - name: Patch manifest
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          perm='<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    '
          intent='<intent><action android:name="android.speech.RecognitionService"/></intent>'
          if '<queries>' in s:
              s=s.replace('<queries>','<queries>'+intent,1)
          else:
              s=s.replace('<application','<queries>'+intent+'</queries>\n    <application',1)
          s=s.replace('<application',perm+'<application',1)
          s=s.replace('android:label="wordten"','android:label="WordTen"')
          open(p,'w',encoding='utf-8').write(s)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: WordTen-apk
          path: build/app/outputs/flutter-apk/app-release.apk
